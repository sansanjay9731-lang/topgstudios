<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="tbl" x1="97" y1="10" x2="94" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#8E8E93" />
      <stop offset="100%" stop-color="#2C2C2E" />
    </linearGradient>
    <linearGradient id="tbr" x1="103" y1="10" x2="106" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7C7CC" />
      <stop offset="60%" stop-color="#636366" />
      <stop offset="100%" stop-color="#1C1C1E" />
    </linearGradient>
    <linearGradient id="bbl" x1="97" y1="190" x2="94" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#636366" />
      <stop offset="100%" stop-color="#2C2C2E" />
    </linearGradient>
    <linearGradient id="bbr" x1="103" y1="190" x2="106" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48484A" />
      <stop offset="100%" stop-color="#1C1C1E" />
    </linearGradient>
    <linearGradient id="lwu" x1="82" y1="90" x2="10" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8E8E93" />
      <stop offset="100%" stop-color="#2C2C2E" />
    </linearGradient>
    <linearGradient id="lwl" x1="82" y1="110" x2="10" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48484A" />
      <stop offset="100%" stop-color="#1C1C1E" />
    </linearGradient>
    <linearGradient id="rwu" x1="118" y1="90" x2="190" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7C7CC" />
      <stop offset="100%" stop-color="#48484A" />
    </linearGradient>
    <linearGradient id="rwl" x1="118" y1="110" x2="190" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#636366" />
      <stop offset="100%" stop-color="#2C2C2E" />
    </linearGradient>
    <radialGradient id="cdg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="1" />
      <stop offset="70%" stop-color="#00FF66" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Background tile for high contrast in browser tab -->
  <rect width="200" height="200" rx="44" fill="#0A0B0D" />

  <!-- Radar ring -->
  <circle cx="100" cy="100" r="82" stroke="#00FF66" stroke-width="3.5" stroke-dasharray="190 16 190 16" fill="none" opacity="0.9" filter="url(#glow)" />
  <circle cx="100" cy="100" r="90" stroke="#00FF66" stroke-width="1" stroke-dasharray="4 8" fill="none" opacity="0.25" />

  <!-- Airframe Wings -->
  <polygon points="82,92 10,100 82,100" fill="url(#lwu)" />
  <polygon points="82,100 10,100 82,108" fill="url(#lwl)" />
  <polygon points="118,92 190,100 118,100" fill="url(#rwu)" />
  <polygon points="118,100 190,100 118,108" fill="url(#rwl)" />

  <!-- Blades -->
  <polygon points="100,10 94,72 100,76" fill="url(#tbl)" />
  <polygon points="100,10 106,72 100,76" fill="url(#tbr)" />
  <polygon points="100,190 94,128 100,124" fill="url(#bbl)" />
  <polygon points="100,190 106,128 100,124" fill="url(#bbr)" />

  <!-- Neon Green Core -->
  <polygon points="100,74 124,100 100,126 76,100" fill="url(#cdg)" filter="url(#glow)" />
  <polygon points="100,82 116,100 100,118 84,100" fill="#00FF66" />
  <polygon points="100,88 109,100 100,112 91,100" fill="#003D1E" />

  <!-- Wingtip Lights -->
  <circle cx="10" cy="100" r="3.5" fill="#00FF66" filter="url(#glow)" />
  <circle cx="190" cy="100" r="3.5" fill="#00FF66" filter="url(#glow)" />
</svg>
